# The dummy app carries a real schema so the model graph has something to draw.
# Associations come from reflections and need no connection, but column lists
# and the schema modal do.
default: &default
  adapter: sqlite3
  pool: 5
  timeout: 5000

development:
  <<: *default
  database: db/development.sqlite3

test:
  <<: *default
  database: db/test.sqlite3
