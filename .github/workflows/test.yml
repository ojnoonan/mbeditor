name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.0"
            gemfile: Gemfile
          - ruby: "3.0"
            gemfile: gemfiles/rails71.gemfile
          - ruby: "3.1"
            gemfile: Gemfile
          - ruby: "3.1"
            gemfile: gemfiles/rails71.gemfile
          - ruby: "3.2"
            gemfile: Gemfile
          - ruby: "3.2"
            gemfile: gemfiles/rails71.gemfile
          - ruby: "3.3"
            gemfile: Gemfile
          - ruby: "3.3"
            gemfile: gemfiles/rails71.gemfile
          - ruby: "3.3"
            gemfile: gemfiles/rails80.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Run tests
        run: bundle exec rake test

      - name: Check Chrome
        if: ${{ !env.ACT }}
        run: google-chrome --version

      - name: Precompile test assets
        if: ${{ !env.ACT }}
        # Run from test/dummy so Rails can find config/application.rb.
        # BUNDLE_GEMFILE must be absolute because we change directories.
        run: BUNDLE_GEMFILE="${{ github.workspace }}/${{ matrix.gemfile }}" RAILS_ENV=test bundle exec rails assets:precompile
        working-directory: test/dummy

      - name: Run system tests
        if: ${{ !env.ACT }}
        run: bundle exec rake system_test

  lint:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: Gemfile

    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Correctness cops only — see .rubocop.yml.
      - name: RuboCop (Lint)
        run: bundle exec rubocop

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - name: Install JS dev tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Syntax, unused declarations, unreachable code, unloaded files — see
      # script/check-js.mjs.
      - name: JS static check
        run: npm run lint:js

  security:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: Gemfile

    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Brakeman static analysis
        run: bundle exec brakeman --no-pager -q -w 2 -i brakeman.ignore -x EOLRails

      - name: bundler-audit CVE check
        run: bundle exec bundler-audit check -u

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - name: npm audit
        run: npm audit --audit-level=high
